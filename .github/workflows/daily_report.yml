name: AI Daily News Report

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Generate report HTML and send LINE summary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GITHUB_PAGES_BASE: "https://yanagimatsu.github.io/ai-news-report"
        run: python scripts/generate_report.py
      - name: Commit and push HTML report
        run: |
          git config user.name "AI朝刊Bot"
          git config user.email "bot@ai-news-report"
          git add docs/
          git diff --staged --quiet || git commit -m "report: $(date +'%Y-%m-%d')"
          git push
